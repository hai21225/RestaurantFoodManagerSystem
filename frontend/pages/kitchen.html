<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bếp - Restaurant Food Manager</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/kitchen.css?v=20261029">
</head>
<body class="kitchen-page">
    <div class="app-shell">
        <aside class="sidebar" aria-label="Điều hướng chính">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">RF</span>
                <div>
                    <strong>Restaurant</strong>
                    <span>POS nội bộ</span>
                </div>
            </div>

            <nav class="main-nav">
                <button class="nav-item" type="button" data-page="../index.html">Tổng quan</button>
                <button class="nav-item" type="button" data-page="tables.html">Bàn ăn</button>
                <button class="nav-item" type="button" data-page="order.html">Đặt món</button>
                <button class="nav-item is-active" type="button" data-page="kitchen.html">Bếp</button>
                <button class="nav-item" type="button" data-page="payment.html">Thanh toán</button>
                <button class="nav-item" type="button" data-page="foods.html">Món ăn</button>
                <button class="nav-item" type="button" data-page="employees.html">Nhân viên</button>
                <button class="nav-item" type="button" data-page="roles.html">Phân quyền</button>
                <button class="nav-item" type="button" data-page="inventory.html">Kho hàng</button>
                <button class="nav-item" type="button" data-page="purchases.html">Nhập hàng</button>
                <button class="nav-item" type="button" data-page="reports.html">Báo cáo</button>
                <button class="nav-item" type="button" data-page="account.html">Tài khoản</button>
            </nav>
        </aside>

        <div class="workspace">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Màn hình bếp</p>
                    <h1>Xử lý món</h1>
                </div>
                <div class="operator">
                    <span class="operator-role" id="kitchenRoleLabel">Quyền xem</span>
                    <strong>Chưa đăng nhập</strong>
                </div>
            </header>

            <main class="content">
                <section class="kitchen-screen" aria-labelledby="kitchen-title">
                    <div class="section-heading">
                        <div>
                            <p class="eyebrow">Hàng đợi chế biến</p>
                            <h2 id="kitchen-title">Phiếu bếp</h2>
                            <p class="kitchen-access-note" id="kitchenAccessNote"></p>
                        </div>
                        <button class="primary-action" type="button" id="refreshKitchenButton">Làm mới</button>
                    </div>

                    <div class="kitchen-summary" id="kitchenSummary" aria-label="Thống kê đơn bếp"></div>

                    <section class="panel kitchen-toolbar" aria-label="Bộ lọc bếp">
                        <div class="filter-group">
                            <label for="kitchenSearch">Tìm bàn, món hoặc phục vụ</label>
                            <input id="kitchenSearch" type="search" placeholder="Tên bàn, tên món, phục vụ">
                        </div>

                        <div class="filter-group">
                            <span>Mức ưu tiên</span>
                            <div class="segmented-control" id="priorityFilters"></div>
                        </div>
                    </section>

                    <div class="kitchen-status-tabs" id="kitchenStatusTabs" aria-label="Trạng thái phiếu bếp"></div>
                    <p class="kitchen-announcement" id="kitchenAnnouncement" role="status" aria-live="polite" aria-atomic="true"></p>
                    <section id="kitchenPendingNotice" class="panel kitchen-pending-notice" hidden aria-labelledby="pendingKitchenTitle">
                        <h3 id="pendingKitchenTitle">Yêu cầu cần đối chiếu</h3><p id="pendingKitchenDescription"></p>
                        <div class="ticket-actions"><button type="button" class="ticket-action" id="reviewKitchenRequest">Tải lại để đối chiếu</button><button type="button" class="ticket-action" id="acknowledgeKitchenRequest" hidden>Đã đối chiếu phiếu, tiếp tục</button></div>
                    </section>
                    <div class="kitchen-board" id="kitchenBoard" aria-label="Bảng trạng thái món"></div>
                    <section id="kitchenReceipt" class="panel kitchen-receipt" hidden aria-labelledby="receiptKitchenTitle"><h3 id="receiptKitchenTitle">Kết quả phiếu vừa xử lý</h3><p class="field-hint">Phiếu đã rời hàng đợi. Kết quả này chỉ để đối chiếu; dùng Làm mới để tải lại.</p><div id="kitchenReceiptContent"></div></section>
                </section>
            </main>
        </div>
    </div>

    <script src="../js/common/auth.js"></script>
    <script src="../js/common/navigation.js?v=20261101-f5-admin"></script>
    <script src="../js/common/api.js"></script>
    <dialog id="kitchenActionDialog" class="form-dialog" aria-labelledby="kitchenActionTitle">
        <div class="form-dialog-header"><div><h2 id="kitchenActionTitle">Xử lý món</h2><p id="kitchenActionDescription"></p></div><button class="dialog-close-button" type="button" data-close-kitchen-action aria-label="Đóng">×</button></div>
        <form id="kitchenActionForm" class="dialog-form">
            <label class="form-field" id="kitchenQuantityField"><span id="kitchenQuantityLabel">Số phần đã làm được của dòng này</span><input id="kitchenPreparedQuantity" type="number" min="0" max="2147483647" step="1"></label>
            <label class="form-field" id="kitchenShortageReasonField"><span>Nguyên nhân thiếu</span><select id="kitchenShortageReason"><option value="PhysicalShortage">Thiếu / hỏng nguyên liệu thực tế</option><option value="OutOfStock">Hết nguyên liệu</option></select></label>
            <label class="form-field" id="kitchenCancelReasonField"><span>Nguyên nhân hủy</span><select id="kitchenCancelReason"><option value="KitchenError">Sự cố chế biến</option><option value="CustomerChange">Khách thay đổi</option></select></label>
            <label class="form-field"><span>Lý do / ghi chú</span><textarea id="kitchenActionReason" rows="3" maxlength="500"></textarea></label>
            <label id="kitchenDeactivateField" class="kitchen-deactivate"><input id="kitchenDeactivateDish" type="checkbox"> Ngừng bán món này vì nguyên liệu không còn đảm bảo. Lý do trên được lưu cho món.</label>
            <p id="kitchenActionHint" class="field-hint"></p><p id="kitchenActionMessage" class="form-message" role="alert"></p>
            <div class="dialog-actions"><button type="button" class="secondary-action" data-close-kitchen-action>Đóng</button><button id="kitchenActionConfirm" class="primary-action" type="submit">Xác nhận</button></div>
        </form>
    </dialog>
    <script src="../js/common/dialogs.js"></script>
    <script src="../js/common/kitchen-session.js"></script>
    <script src="../js/pages/kitchen.js?v=20261029"></script>
</body>
</html>
