<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chọn bàn - Restaurant Food Manager</title>
    <link rel="stylesheet" href="../css/base.css?v=20261105-role-access3">
    <link rel="stylesheet" href="../css/layout.css?v=20261105-role-access3">
    <link rel="stylesheet" href="../css/components.css?v=20261109-role-review">
    <link rel="stylesheet" href="../css/pages/tables.css?v=20261110-tables-clean">
    <link rel="stylesheet" href="../css/pages/service-workspace.css?v=20261112-stitch-layout3">
</head>
<body class="service-workspace service-workspace--tables">
    <div class="app-shell">
        <aside class="sidebar" aria-label="Điều hướng chính">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">RF</span>
                <div>
                    <strong>Restaurant</strong>
                    <span>POS nội bộ</span>
                </div>
            </div>

            <nav class="main-nav">
                <button class="nav-item" type="button" data-page="../index.html">Tổng quan</button>
                <button class="nav-item is-active" type="button" data-page="tables.html">Bàn ăn</button>
                <button class="nav-item" type="button" data-page="order.html">Đặt món</button>
                <button class="nav-item" type="button" data-page="kitchen.html">Bếp</button>
                <button class="nav-item" type="button" data-page="payment.html">Thanh toán</button>
                <button class="nav-item" type="button" data-page="foods.html">Món ăn</button>
                <button class="nav-item" type="button" data-page="employees.html">Nhân viên</button>
                <button class="nav-item" type="button" data-page="roles.html">Phân quyền</button>
                <button class="nav-item" type="button" data-page="inventory.html">Kho hàng</button>
                <button class="nav-item" type="button" data-page="purchases.html">Nhập hàng</button>
                <button class="nav-item" type="button" data-page="reports.html">Báo cáo</button>
                <button class="nav-item" type="button" data-page="account.html">Tài khoản</button>
            </nav>
        </aside>

        <div class="workspace">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Khu vực phục vụ</p>
                    <h1>Chọn bàn</h1>
                </div>
                <div class="operator">
                    <span class="operator-role">Nhân viên</span>
                    <strong>Chưa đăng nhập</strong>
                </div>
            </header>

            <main class="content">
                <section class="tables-screen" aria-labelledby="tables-title">
                    <div class="tables-layout">
                        <section class="panel table-board" aria-labelledby="tables-title">
                            <div class="panel-header">
                                <div class="table-board-title"><h2 id="tables-title">Sơ đồ bàn</h2><span id="visibleTableCount">0 bàn</span></div>
                                <div class="heading-actions">
                                    <button class="secondary-action" type="button" id="refreshTablesButton">Làm mới</button>
                                    <button class="secondary-action" type="button" id="manageTablesButton" hidden>Sửa bàn / Khu vực</button>
                                    <button class="primary-action" type="button" id="addTableButton" hidden>Thêm bàn</button>
                                </div>
                            </div>
                    <div class="service-table-overview">
                    <div class="tables-summary" id="tablesSummary" aria-label="Thống kê trạng thái bàn"></div>

                    <section class="panel tables-toolbar" aria-label="Bộ lọc bàn">
                        <label class="filter-group">
                            <span>Khu vực</span>
                            <select id="areaFilters"></select>
                        </label>

                        <label class="filter-group">
                            <span>Trạng thái</span>
                            <select id="statusFilters"></select>
                        </label>
                    </section>

                    </div>

                            <p id="tableListNotice" class="ui-message" role="status"></p>
                            <div class="restaurant-map" id="restaurantMap"></div>
                        </section>

                        <aside class="panel table-detail" aria-labelledby="table-detail-title">
                            <div class="panel-header">
                                <h3 id="table-detail-title">Chi tiết bàn</h3>
                                <span id="selectedTableStatus">Chưa chọn</span>
                                <button class="detail-close-button" type="button" id="closeTableDetailButton" aria-label="Đóng chi tiết bàn">×</button>
                            </div>

                            <div class="selected-table" id="selectedTable">
                                <p>Chọn một bàn để xem chi tiết và thao tác tiếp theo.</p>
                            </div>
                        </aside>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <dialog id="tableDialog" class="form-dialog" aria-labelledby="tableDialogTitle">
        <div class="form-dialog-header">
            <div>
                <h2 id="tableDialogTitle">Thêm bàn ăn</h2>
                <p>Bàn mới sẽ ở trạng thái trống và sẵn sàng phục vụ.</p>
            </div>
            <button class="dialog-close-button" type="button" data-close-table-dialog aria-label="Đóng">×</button>
        </div>
        <form id="tableForm" class="dialog-form">
            <div class="dialog-form-grid">
                <label class="form-field">
                    <span>Số hoặc tên bàn</span>
                    <input name="tableNumber" type="text" maxlength="20" placeholder="Ví dụ: 01 hoặc VIP-01" required>
                </label>
                <label class="form-field">
                    <span>Sức chứa</span>
                    <input name="capacity" type="number" inputmode="numeric" min="1" max="100" value="4" required>
                </label>
                <label class="form-field">
                    <span>Khu vực</span>
                    <select name="areaId" id="tableAreaSelect"></select>
                </label>
            </div>
            <p id="tableFormMessage" class="form-message" role="alert"></p>
            <div class="dialog-actions">
                <button class="secondary-action" type="button" data-close-table-dialog>Hủy</button>
                <button id="tableSubmit" class="primary-action" type="submit">Tạo bàn</button>
            </div>
        </form>
    </dialog>

    <dialog id="tableLifecycleDialog" class="form-dialog" aria-labelledby="tableLifecycleTitle">
        <div class="form-dialog-header">
            <div>
                <h2 id="tableLifecycleTitle">Xóa bàn khỏi danh sách sử dụng</h2>
                <p id="tableLifecycleName"></p>
            </div>
            <button class="dialog-close-button" type="button" data-close-table-lifecycle aria-label="Đóng">×</button>
        </div>
        <div class="dialog-form">
            <p id="tableLifecycleNotice" class="lifecycle-notice"></p>
            <p id="tableLifecycleMessage" class="form-message" role="alert"></p>
            <div class="dialog-actions">
                <button class="secondary-action" type="button" data-close-table-lifecycle>Hủy</button>
                <button id="tableLifecycleConfirm" class="danger-action" type="button">Xóa bàn</button>
            </div>
        </div>
    </dialog>

    <script src="../js/common/auth.js?v=20261105-role-access3"></script>
    <script src="../js/common/api.js?v=20261105-role-access3"></script>
    <script src="../js/common/navigation.js?v=20261112-service-nav10"></script>
    <script src="../js/common/dialogs.js"></script>
    <script src="../js/data/tables.data.js?v=20261110-tables-clean"></script>
    <script src="../js/pages/tables.js?v=20261112-print1"></script>
</body>
</html>
