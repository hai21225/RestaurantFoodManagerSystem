<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Food Manager</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css?v=20261101-f6">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/dashboard.css">
    <link rel="stylesheet" href="css/pages/reports.css?v=20261101-f5-ui">
</head>
<body class="reporting-page">
    <div class="app-shell">
        <aside class="sidebar" aria-label="Điều hướng chính">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">RF</span>
                <div>
                    <strong>Restaurant</strong>
                    <span>POS nội bộ</span>
                </div>
            </div>

            <nav class="main-nav">
                <button class="nav-item is-active" type="button">Tổng quan</button>
                <button class="nav-item" type="button" data-page="pages/tables.html">Bàn ăn</button>
                <button class="nav-item" type="button" data-page="pages/order.html">Đặt món</button>
                <button class="nav-item" type="button" data-page="pages/kitchen.html">Bếp</button>
                <button class="nav-item" type="button" data-page="pages/payment.html">Thanh toán</button>
                <button class="nav-item" type="button" data-page="pages/foods.html">Món ăn</button>
                <button class="nav-item" type="button" data-page="pages/employees.html">Nhân viên</button>
                <button class="nav-item" type="button" data-page="pages/roles.html">Phân quyền</button>
                <button class="nav-item" type="button" data-page="pages/inventory.html">Kho hàng</button>
                <button class="nav-item" type="button" data-page="pages/purchases.html">Nhập hàng</button>
                <button class="nav-item" type="button" data-page="pages/reports.html">Báo cáo</button>
                <button class="nav-item" type="button" data-page="pages/account.html">Tài khoản</button>
            </nav>
        </aside>

        <div class="workspace">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Tổng quan</p>
                    <h1>Tổng quan nhà hàng</h1>
                </div>
                <div class="operator">
                    <span class="operator-role">Nhân viên</span>
                    <strong>Chưa đăng nhập</strong>
                </div>
            </header>

            <main class="content">
                <section id="dashboardAccess" class="panel reporting-access" hidden aria-label="Chọn nghiệp vụ theo vai trò"></section>
                <section class="screen is-visible" id="dashboard-screen" aria-labelledby="dashboard-title">
                    <div class="section-heading">
                        <div>
                            <p class="eyebrow">Tổng quan hôm nay</p>
                            <h2 id="dashboard-title">Hoạt động hôm nay</h2>
                        </div>
                        <div class="reporting-actions"><button class="secondary-action" type="button" id="refreshDashboard">Làm mới</button><button class="secondary-action" type="button" id="createOrderButton">Tạo đơn mới</button><a class="primary-action" href="pages/reports.html">Xem báo cáo doanh thu →</a></div>
                    </div>
                    <p id="dashboardNotice" class="reporting-notice" role="status"></p>
                    <p id="dashboardUpdated" class="reporting-caption"></p>
                    <div class="metric-grid" id="metricGrid" aria-label="Chỉ số tổng quan"></div>
                    <p id="dashboardEmpty" class="report-empty" hidden></p>
                    <section class="panel kitchen-overview" aria-labelledby="kitchen-summary-title"><div class="panel-header"><h3 id="kitchen-summary-title">Phiếu bếp đang mở</h3><a href="pages/kitchen.html">Mở màn Bếp</a></div><div id="kitchenSummary" class="dashboard-counts"></div></section>
                    <div class="dashboard-layout">
                        <section class="panel table-panel" aria-labelledby="table-status-title">
                            <div class="panel-header">
                                <h3 id="table-status-title">Trạng thái bàn</h3>
                                <span id="dashboardTableCount">—</span>
                            </div>
                            <div id="tableSummary" class="dashboard-counts"></div>
                            <div class="table-map" id="tableMap"></div>
                        </section>

                        <section class="panel order-panel" aria-labelledby="order-queue-title">
                            <div class="panel-header">
                                <h3 id="order-queue-title">Đơn đang mở gần nhất</h3>
                                <span id="queueCount">—</span>
                            </div>

                            <div class="filter-bar" aria-label="Lọc đơn hàng">
                                <button class="filter-button is-active" type="button" data-filter="all">Tất cả</button>
                                <button class="filter-button" type="button" data-filter="waiting">Chờ bếp</button>
                                <button class="filter-button" type="button" data-filter="preparing">Đang làm</button>
                                <button class="filter-button" type="button" data-filter="ready">Đã xong</button>
                            </div>
                            <p class="reporting-caption">Hiển thị tối đa 10 đơn đang mở mới nhất.</p>
                            <div class="order-list" id="orderList"></div>
                        </section>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="js/common/auth.js?v=20261101-f6"></script>
    <script src="js/common/api.js"></script>
    <script src="js/common/navigation.js?v=20261101-f6"></script>
    <script src="js/common/reporting-session.js"></script>
    <script src="js/pages/dashboard.js?v=20261101-f5-ui"></script>
</body>
</html>
